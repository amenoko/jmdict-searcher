function keywordbox_add (search_word, disabled) {
    // if user pastes string with spaces, trim and split it here
    keyword_array = search_word.trim().split(/\s+/);
    if (keyword_array != "") {
        for (q=0;q<keyword_array.length;q++) {
            box = document.createElement("div");
            box.textContent = keyword_array[q];
            if (disabled == null) { disabled == false; }
            if (!disabled) { box.setAttribute("class", "keywordbox"); }
            else { box.setAttribute("class", "keywordbox grey"); }

            document.getElementById("search_field").before(box);
            x = document.createElement("input");
            x.value=" ";
            x.setAttribute("type", "submit");
            x.setAttribute("class","keywordbox_x");
            x.addEventListener("click", (xevent) => {
                xevent.target.parentElement.remove();
            });
            box.appendChild(x);
        }
        setTimeout(() => {
            document.getElementById("search_field").value = "";
            update_search_label();
        }, 100);
    }
}

// last cursor position
last_cur_pos=0;
function keywordbox_init() {
    document.getElementById("search_field").addEventListener("keydown", (event) => {
        console.log("search_field keydown event: " + event.key);
        if (event.key == "Space" || event.key == " " || event.key == "ArrowRight") {
            if (event.target.value.match(/^\s*$/) == null && event.target.selectionStart == event.target.value.length) {
                keywordbox_add(event.target.value.trim());
                event.target.value = event.target.value.slice(0,-1);
            } else { event.target.value == "" ; }
        }

        // pop rightmost/newest box back in
        setTimeout(() => {
            boxes = document.getElementsByClassName("keywordbox");
            if (boxes.length > 0 && event.target.selectionStart == 0 && last_cur_pos == 0) {
                last_text = boxes[boxes.length-1].textContent;
                if (event.key == "ArrowLeft") {
                    if (event.target.value == "" ) {
                        event.target.value = last_text;
                    } else {
                        event.target.value = last_text + " " + event.target.value;
                    }
                    boxes[boxes.length-1].remove();
                    event.target.selectionStart = last_text.length - 1;
                    event.target.selectionEnd = last_text.length - 1;

                } else if (event.key == "Backspace") {
                    if (event.target.value == "" ){
                        event.target.value = last_text.slice(0,-1);
                    } else {
                        event.target.value = last_text.slice(0,-1) + " " + event.target.value;
                    }
                    event.target.selectionStart = event.target.value.length;
                    event.target.selectionEnd = event.target.value.length;
                    boxes[boxes.length-1].remove();
                }
            }
            event.target.value = event.target.value.trim();
            last_cur_pos = event.target.selectionStart;
            update_search_label();
        },100);
        //setTimeout( () => { update_search_label(); }, 100);
    });

    url_query_params = new URLSearchParams(window.location.search);
    url_query_search_word = url_query_params.get('q');
    console.log("keywordbox_init(): url_query_search_word = " + url_query_search_word);
    console.log("keywordbox_init(): url_query_params = " + url_query_params);
    if (url_query_search_word != null && url_query_search_word.match(/^\s*$/) == null) {
        search_words_array = url_query_search_word.split(/\s+/);
        console.log("keywordbox_init(): search_words_array.length = " + search_words_array.length);
        for (b=0;b<search_words_array.length;b++) {
            console.log("keywordbox_init(): keywordbox_add(\"" + search_words_array[b] + "\")");
            keywordbox_add(search_words_array[b], true);
        }
        notification("URL keywords: " + url_query_search_word);
    }
    // we run searchexec() no matter if keywords or not, because it'll display greeting screen
    searchexec();
}

function roma_to_hira(input) {
    output = "";
    input_string = input;
    while (input_string.length > 0) {
        piece_matched=false;
        if (input_string == "") {
                console.log("roma_to_hira(): return " + output);
                return output;
        }

        //double consonants
        if(input_string[0] == input_string[1]) {
            output += "っ";
            input_string = input_string.slice(1);
            piece_matched=true;
        }


        if (!piece_matched) {
            for (let r=0;r<romatable.length;r++) {
                if (input_string.slice(0,3) == romatable[r]) {
                    console.log("roma_to_hira(): " + input_string.slice(0,3) + " matches " + romatable[r]);
                    output += hiratable[r];
                    console.log("roma_to_hira(): output = " + output);
                    input_string = input_string.slice(3);
                    piece_matched = true;
                    r=romatable.length; // break out of this for loop
                }
            }
        }
        if (!piece_matched) {
            for (let r=0;r<romatable.length;r++) {
                if (input_string.slice(0,2) == romatable[r]) {
                    console.log("roma_to_hira(): " + input_string.slice(0,2) + " matches " + romatable[r]);
                    output += hiratable[r];
                    input_string = input_string.slice(2);
                    piece_matched = true;
                    r=romatable.length;
                }
            }
        }

        if (!piece_matched) {
            for (let r=0;r<romatable.length;r++) {
                if (input_string.slice(0,1) == romatable[r]) {
                    console.log("roma_to_hira(): " + input_string.slice(0,1) + " matches " + romatable[r]);
                    output += hiratable[r];
                    input_string = input_string.slice(1);
                    piece_matched = true;
                    r=romatable.length;
                }
            }
        }



        if (!piece_matched) {
            output += input_string[0];
            input_string = input_string.slice(1);
        }
    }
    return output;
}

function strip_hiragana(input_string) {
    input_stripped = "";
    if(input_string.match(/\p{Script=Han}/gu) != null) {
        input_stripped_array = input_string.match(/[^\p{Script=Hiragana}]/gu);
        for (s=0;s<input_stripped_array.length;s++) {
            input_stripped += input_stripped_array[s];
        }
    }
    return input_stripped;
}

async function focus(animate) {
    if (animate == null) { animate = true; }
    console.log("focus()")

    if (document.getElementById("search_field").disabled == true) { animate = false; }

    if (document.activeElement != document.getElementById("search_field") && animate) {
        document.getElementById("search_field_parent").setAttribute("class", "activate");
        setTimeout(() => { document.getElementById("search_field_parent").setAttribute("class", "");},500);
    }

    // fix browser shortcuts not working? ctrl+r, f3, f5
    //setTimeout(() => { document.getElementById("search_field").focus(); }, 500);
    document.getElementById("search_field").focus();
}

async function disable_input(value) {
    console.log("disable_input(): begin");
    if(value == null) {
        console.log("disable_input(): no param, setting value to true");
        value = true;
    }
    console.log("disable_input(): value = " + value);
    keywordbox_array = document.getElementsByClassName("keywordbox");
    keywordbox_x_array = document.getElementsByClassName("keywordbox_x");
    console.log("disable_input(): keywordbox_array.length = " + keywordbox_array.length);
    console.log("disable_input(): keywordbox_x_array.length = " + keywordbox_x_array.length);
    if (value) {
        console.log("disable_input(): value is true, disabling stuff");
        document.getElementById("search_field_parent").setAttribute("class", "search_field_parent_disabled");
        for (let m=0;m<keywordbox_array.length;m++) {
            keywordbox_array[m].setAttribute("class", "keywordbox grey");
        }
    } else {
        console.log("disable_input(): value is false, un-disabling stuff");
        document.getElementById("search_field_parent").setAttribute("class", "");
        for (let m=0;m<keywordbox_array.length;m++) {
            keywordbox_array[m].setAttribute("class", "keywordbox");
        }
    }

    for (let m=0;m<keywordbox_x_array.length;m++) { keywordbox_x_array[m].disabled = value; }
    document.getElementById("search_field").disabled = value;
    document.getElementById("search_button").disabled = value;
    document.getElementById("paste").disabled = value;
    document.getElementById("clear").disabled = value;
    document.getElementById("clear_paste").disabled = value;
    return new Promise(resolve => setTimeout(resolve, 0));
    update_search_label();
}

function clear_input() {
    document.getElementById("search_field").value = "";
    while(keywordbox_array[0]) {
        keywordbox_array[0].remove();
    }
    focus();
    update_search_label();
}

// dynamically display "home" to indicate clicking the button returns user to home page (greeting)
function update_search_label() {
    search_button = document.getElementById("search_button");
    // if front page is visible always display "Search"
    if (document.getElementById("greeting_container").style.display != "none") {
        search_button.value = "Search";
    } else {
        if (document.getElementById("search_field").value.match(/^\s*$/) != null && document.getElementsByClassName("keywordbox").length == 0) {
            search_button.value = "Home";
        } else { search_button.value = "Search"; }
    }
}

// INIT
async function init() {
    ui_log("init(): begin");
    try {
        const [r1,r2] = await Promise.all([
        fetch("JMdict.json.gz.1"),
        fetch("JMdict.json.gz.2")
        ]);

        console.log("init(): response status: " + r1.status + " " + r1.status);

        if (!r1.ok || !r2.ok) {
            throw new Error("init(): Fetch failed");
            console.log("init(): Fetch failed");
        }

        inflateme = new Uint8Array(27245728);
        inflateme.set(new Uint8Array(await r1.arrayBuffer()), 0);
        inflateme.set(new Uint8Array(await r2.arrayBuffer()), 18000000);
        console.log("init(): unzipping & parsing");
        jm = JSON.parse(pako.ungzip(inflateme,{ 'to': 'string' }));


    } catch (error) {
        console.error(error.message);
        ui_log("init(): error: " + error.message);
        return 1;
    }

    try {
        const response = await fetch("kanjidic2.xml.gz");
        if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
            ui_log("init(): fetch(\"kanjidic2.xml.gz\") failed: " + response.status);
        }

        const result = await response.arrayBuffer();
        inflateme = new Uint8Array(result);
        ui_log("init(): pako.gunzip() kanjidic2");
        inflated = pako.ungzip(inflateme,{ 'to': 'string' });
        ui_log("init(): DomParser() for kanjidic2");
        xmlDoc_kanji = new window.DOMParser().parseFromString(inflated, "text/xml");

        console.log("init(): loaded kanjidic2");
        kanji_date = xmlDoc_kanji.getElementsByTagName("date_of_creation")[0].textContent;

    } catch (error) {
        console.error(error.message);
        ui_log("init(): error: " + error.message);
        return 2;
    }
    ui_log("init(): end");
    return new Promise(resolve => setTimeout(resolve, 0));
}

// CORE LOGIC / SEARCHER
async function searchXML(search_word, display_search_term_header) {
    console.log("searchXML(): begin, search_word = " + search_word);
    results_container = document.getElementById("results_container");
    results_container.style.setProperty("display", "flex");

    if (search_word === null || search_word.match(/^ *$/) !== null) {
        console.log("searchXML(): empty, quitting");
        return;
    }
    found=false;
    entries=jm.JMdict.entry;
    new_iframe = document.createElement("iframe");
    new_iframe.setAttribute("class","results_container_column");
    //new_iframe.style.setProperty("display", "none");

    // push newer searches to top
    console.log("searchXML(): results_container.childElementCount = " + results_container.childElementCount);
    if (results_container.childElementCount == 0 ) {
        results_container.appendChild(new_iframe);
    } else {
        results_container.children[0].before(new_iframe);
    }


    results_container_column = new_iframe.contentWindow.document;
    // inject parent css
    document.querySelectorAll('style').forEach(style => {
        results_container_column.head.appendChild(style.cloneNode(true));
    });
    link = results_container_column.createElement("link");
    link.type = "text/css";
    link.rel = "stylesheet";
    link.href = "search.css";
    results_container_column.head.appendChild(link);
    results_container_column.body.setAttribute("class","results_container_column_inside");
    // css has scrollbar-width: none; so we manually change it for iframe here
    results_container_column.documentElement.style.setProperty("scrollbar-width", "auto");
    // same with overflow
    results_container_column.body.style.setProperty("overflow-y", "scroll");
    if (light_mode_enabled) { light_mode(results_container_column); }

    add_keydown_event(results_container_column);

    // kanjidic2 query
    found_kanji=false;
    if (search_word.length < 10) {
        characters=xmlDoc_kanji.getElementsByTagName("character");
        for (let p=0;p < characters.length;p++) {
            found_kanji=false
            // each <character> has only 1 <literal> entry (I checked)
            kanji_literal = characters[p].getElementsByTagName("literal")[0].textContent;
            if (search_word.includes(kanji_literal)) {
                console.log("searchXML(): found character: " + kanji_literal);
                found_kanji=true;
            }

            if (found_kanji) {
                row_container = results_container_column.createElement("div");
                row_container.setAttribute("class","row_container");

                new_html_element = results_container_column.createElement("div");
                new_html_element.setAttribute("class","kanjidic2_kanji");
                new_html_element.textContent = kanji_literal + "";
                row_container.appendChild(new_html_element);
                //new_html_element.setAttribute("href", "https://lingweb.eva.mpg.de/kanji/index.html?kanji=" + kanji_literal);
                //new_html_element.setAttribute("target", "_blank");
                add_clipboard_event(new_html_element);

                // joyo display
                joyo_html_element = results_container_column.createElement("div");
                joyo_html_element.setAttribute("class", "kanjidic2_joyo");
                row_container.appendChild(joyo_html_element);
                grade = characters[p].getElementsByTagName("grade");
                if (grade[0] != null) {
                    if (grade[0].textContent == 9) { joyo_html_element.textContent = "Jinmeiyō"; }
                    else { joyo_html_element.textContent = "Jōyō"; }
                    // append later, in case it helps with formatting
                } else {
                    joyo_html_element.textContent = "Hyōgai";
                    joyo_html_element.setAttribute("class", "kanjidic2_hyougai");
                }

                // make one container for meanings and readings to allow them to line break
                // and not take up extra space
                mr_container = results_container_column.createElement("div");
                mr_container.setAttribute("class", "kanjidic2_mr_container");
                row_container.appendChild(mr_container);

                // meanings
                kanji_meanings = characters[p].getElementsByTagName("meaning");
                new_html_element = results_container_column.createElement("div");
                for (let o=0;o < kanji_meanings.length;o++) {
                    if (kanji_meanings[o].getAttribute("m_lang") == null || kanji_meanings[o].getAttribute("m_lang").match(/^$/))
                        { new_html_element.textContent += kanji_meanings[o].textContent +  ", "; }
                }
                new_html_element.textContent = new_html_element.textContent.slice(0,-2); // trailing ", "
                new_html_element.setAttribute("class", "kanjidic2_meanings");
                add_clipboard_event(new_html_element);
                mr_container.appendChild(new_html_element);

                // readings
                kanji_readings = characters[p].getElementsByTagName("reading");
                new_html_element = results_container_column.createElement("div");
                for (let o=0;o < kanji_readings.length;o++) {
                    // skip if foreign language
                    if (kanji_readings[o].getAttribute("r_type") == null || kanji_readings[o].getAttribute("r_type").match(/^$|ja_on|ja_kun/)) {
                        new_html_element.textContent +=  kanji_readings[o].textContent + "・";

                        // to check whether we're at the last (viable) item
                        // (o alone isn't useful since the last items are foreign and skipped)
                        //if (kanji_readings[o+1] == null) {console.log("doing nothing");}
                        //else {new_html_element.textContent += ", ";}
                    }
                }
                new_html_element.textContent = new_html_element.textContent.slice(0,-1); // trailing "・"
                new_html_element.setAttribute("class", "kanjidic2_readings");
                mr_container.appendChild(new_html_element);

                if (grade != null) { mr_container.appendChild(joyo_html_element); }


                // external links
                link_container = results_container_column.createElement("div");
                link_container.setAttribute("class", "kanjidic2_link_container");

                new_html_element = results_container_column.createElement("a");
                new_html_element.textContent = "Wiktionary";
                new_html_element.setAttribute("target", "_blank");
                new_html_element.setAttribute("href", "https://en.wiktionary.org/wiki/" + kanji_literal);
                link_container.appendChild(new_html_element);

                link_container.innerHTML += "・";

                new_html_element = results_container_column.createElement("a");
                new_html_element.textContent = "JP-DE Hans-Jörg Bibiko";
                new_html_element.setAttribute("target", "_blank");
                new_html_element.setAttribute("href", "https://lingweb.eva.mpg.de/kanji/index.html?kanji=" + kanji_literal);
                link_container.appendChild(new_html_element);

                link_container.innerHTML += "・";

                new_html_element = results_container_column.createElement("a");
                new_html_element.textContent = "kanji.me";
                new_html_element.setAttribute("target", "_blank");
                new_html_element.setAttribute("href", "https://kanji.me/" + kanji_literal);
                link_container.appendChild(new_html_element);

                mr_container.appendChild(link_container);

                results_container_column.body.appendChild(row_container);
            }
        } // end of kanjidic2 query loop
    }
    if (found_kanji) { new_iframe.style.setProperty("display", "block"); }

    row_prio_container = results_container_column.createElement("div");
    row_prio_container.setAttribute("class", "row_prio_container");
    results_container_column.body.appendChild(row_prio_container);

    results_tally=0; // for exiting when too many results
    discarded=0; // keeping track of how many results had to be discarded after 500


    // jmdict query
    for (entry of entries) {
        found=false;
        priority=0; // 0 normal, 1 append to top, 2 append to top after 1 (so it's higher)
        // priority is additive, 2 points for exact matches, 1 point for frequency tag,
        // 1 point for hiragana-less match

        exact_keb_match=false;
        exact_reb_match=false;
        has_kebs=false;
        hiraganaless_match=false;
        entry_match_string = "";

        // <!ELEMENT entry (ent_seq, k_ele*, r_ele+, sense+)>
        // k_eles are OPTIONAL, check for null value
        if (entry.k_ele != null) {
            has_kebs=true;
            k_eles = Array.isArray(entry.k_ele) ? entry.k_ele : [entry.k_ele];
            for (let k_ele of k_eles) {
                if (k_ele.keb.includes(search_word)) {
                    found=true;
                    console.log("searchXML(): keb match: " + k_ele.keb);
                    if (k_ele.keb == search_word) {
                        console.log("searchXML(): exact keb match: " + k_ele.keb);
                        exact_keb_match=true;
                    }
                } else if (strip_hiragana(k_ele.keb) != "" && strip_hiragana(k_ele.keb) == strip_hiragana(search_word)) {
                    // hiragana-less match
                    console.log("searchXML(): kanaless match: " + k_ele.keb);
                    hiraganaless_match=true;
                    found=true;
                }
            }
        }

        // one r_ele is always required so no need to check for null
        r_eles = Array.isArray(entry.r_ele) ? entry.r_ele : [entry.r_ele];
        for (let r_ele of r_eles) {
            if (r_ele.reb.includes(search_word)) {
                found=true;
                console.log("searchXML(): reb match: " + r_ele.reb);
                if (r_ele.reb == search_word) {
                    console.log("searchXML(): exact reb match: " + r_ele.reb);
                    exact_reb_match=true;
                }
            }
        }


        if(exact_keb_match || exact_reb_match) {
            priority += 2;
        } // we don't add priority for kanaless, for now




        if (found) {
            row_container = results_container_column.createElement("div");
            row_container.setAttribute("class","row_container");

            // had a brainfart when I named this container and now it's too late to change it
            meanings_readings = results_container_column.createElement("div");
            meanings_readings.setAttribute("class","meanings_readings");
            row_container.appendChild(meanings_readings);
            has_freq_tag=false;

            // string containing search-only-forms (if there are any) for
            // internal html (not user-facing), mainly for debug
            search_only_string="";

            // BUILD LIST OF READINGS (rebs)
            // <!ELEMENT r_ele (reb, re_nokanji?, re_restr*, re_inf*, re_pri*)>
            for (r_ele of r_eles) {
                // always 1 reb, no loop
                new_html_element = results_container_column.createElement("div");
                if (has_kebs) { new_html_element.setAttribute("class","reb"); }
                else { new_html_element.setAttribute("class","reb_white"); }
                new_html_element.textContent = r_ele.reb;
                add_clipboard_event(new_html_element);
                meanings_readings.appendChild(new_html_element);

                // optional re_restr
                // "This element is used to indicate when the reading only applies to a subset
                // of the keb elements in the entry. In its absence, all readings apply to all
                // kanji elements. The contents of this element must exactly match those of one
                // of the keb elements."
                // can't hurt to include this
                if (r_ele.re_restr != null) {
                    re_restrs = Array.isArray(r_ele.re_restr) ? r_ele.re_restr : [r_ele.re_restr];
                    for (re_restr of re_restrs) {
                        new_html_element = results_container_column.createElement("div");
                        if (has_kebs) { new_html_element.setAttribute("class","reb re_restr"); }
                        else { new_html_element.setAttribute("class","reb_white re_restr"); }
                        new_html_element.textContent = re_restr;
                        meanings_readings.appendChild(new_html_element);
                    }
                }

                // optional re_inf
                // "Typically it will be used to indicate some unusual aspect of the reading"
                if (r_ele.re_inf != null) {
                    re_infs = Array.isArray(r_ele.re_inf) ? r_ele.re_inf : [r_ele.re_inf];
                    for (re_inf of re_infs) {
                        new_html_element = results_container_column.createElement("div");
                        if (has_kebs) { new_html_element.setAttribute("class","reb re_inf"); }
                        else { new_html_element.setAttribute("class","reb_white re_inf"); }
                        new_html_element.textContent = re_inf;
                        meanings_readings.appendChild(new_html_element);
                    }
                }

                // optional re_pri
                // same as ke_pri (frequency tags)
                /*if (r_ele.re_pri != null) {
                    re_pris = Array.isArray(r_ele.re_pri) ? r_ele.re_pri : [r_ele.re_pri];
                    for (re_pri of re_pris) {
                        new_html_element = results_container_column.createElement("div");
                        if (has_kebs) { new_html_element.setAttribute("class","reb re_pri"); }
                        else { new_html_element.setAttribute("class","reb_white re_pri"); }
                        new_html_element.textContent = re_pri;
                        meanings_readings.appendChild(new_html_element);
                    }
                }*/ // WHICH MEANS WE CAN SKIP
            }

            // BUILD LIST OF KANJI ELEMENTS (kebs)
            // k_eles are OPTIONAL, check if there are any before proceeding
            // <!ELEMENT entry (ent_seq, k_ele*, r_ele+, sense+)>
            // <!ELEMENT k_ele (keb, ke_inf*, ke_pri*)>
            if (entry.k_ele != null) {
                k_ele_container = results_container_column.createElement("div");
                k_ele_container.setAttribute("class","k_ele_container");
                for (let i=0;i<k_eles.length;i++) {
                    k_ele = k_eles[i];
                    // check if ke_inf exists and contains search-only desc so we
                    // can skip displaying this reading
                    // <!ELEMENT k_ele (keb, ke_inf*, ke_pri*)>
                    skip=false;
                    if (k_ele.ke_inf != null) {
                        ke_infs = Array.isArray(k_ele.ke_inf) ? k_ele.ke_inf : [k_ele.ke_inf];
                        for (ke_inf of ke_infs) {
                            if(ke_inf == "search-only kanji form") {
                                    console.log("searchXML(): search-only kanji form, skip");
                                    skip=true;
                            }
                        }
                    }
                    // for debug, not user-facing, custom html attribute
                    if(skip) {
                        search_only_string += k_ele.keb + " ";
                    }

                    if (!skip) {

                        // <!ELEMENT k_ele (keb, ke_inf*, ke_pri*)>
                        // there is only ever one keb per k_ele, no need for a loop
                        // keb
                        if (k_ele.keb != null) {
                            new_html_element = results_container_column.createElement("div");
                            new_html_element.setAttribute("class","keb");
                            add_clipboard_event(new_html_element);
                            new_html_element.textContent = k_ele.keb;
                            k_ele_container.appendChild(new_html_element);
                        }

                        // ke_inf
                        // was already initialized above (for checking search-only forms)
                        if (k_ele.ke_inf != null) {
                            for (ke_inf of ke_infs) {
                                new_html_element = results_container_column.createElement("div");
                                new_html_element.setAttribute("class","k_ele_other");
                                new_html_element.textContent = ke_inf;
                                k_ele_container.appendChild(new_html_element);
                            }
                        }

                        // ke_pri
                        if (k_ele.ke_pri != null) {
                            has_freq_tag=true;
                            ke_pris = Array.isArray(k_ele.ke_pri) ? k_ele.ke_pri : [k_ele.ke_pri];
                            for (ke_pri of ke_pris) {
                                new_html_element = results_container_column.createElement("div");
                                new_html_element.setAttribute("class","k_ele_freq");
                                new_html_element.textContent = ke_pri;
                                k_ele_container.appendChild(new_html_element);
                            }
                        }
                        if (i < k_eles.length - 1) {
                            line_break = results_container_column.createElement("br");
                            k_ele_container.appendChild(line_break);
                        }
                    }

                }
                meanings_readings.appendChild(k_ele_container);
            }


            // BUILD LIST OF MEANINGS (right side)
            //
            // german will be dumped into one block after the for loop
            senses_german = [];
            // <!ELEMENT entry (ent_seq, k_ele*, r_ele+, sense+)>
            // at minimum 1 sense, check for array but no need to check for null
            senses = Array.isArray(entry.sense) ? entry.sense : [entry.sense];
            senses_container = results_container_column.createElement("div");
            senses_container.setAttribute("class","senses_container");
            row_container.appendChild(senses_container);
            for (sense of senses) {
                // <!ELEMENT sense (stagk*, stagr*, pos*, xref*, ant*, field*, misc*, s_inf*, lsource*, dial*, gloss*, example*)>

                // first and foremost check if this sense is english
                // presumably if one gloss is english all its siblings will be
                // english too
                // according to documentation, gloss is OPTIONAL so...
                xml_lang = "none!";
                if(sense.gloss != null) {
                    glosses = Array.isArray(sense.gloss) ? sense.gloss : [sense.gloss];
                    xml_lang = glosses[0]['@attributes']['xml:lang'];
                }


                if (xml_lang == "eng") {
                    sense_block_container = results_container_column.createElement("div");
                    sense_block_container.setAttribute("class","senses_block_container");
                    sense_glosses = "";
                    sense_extras = "";
                    for(gloss of glosses) {
                        sense_glosses += gloss['#text'] + ", ";
                    }
                    sense_glosses_element = results_container_column.createElement("div");
                    sense_glosses_element.setAttribute("class", "senses_glosses");
                    sense_glosses_element.textContent = sense_glosses.slice(0,-2);
                    add_clipboard_event(sense_glosses_element);
                    sense_block_container.appendChild(sense_glosses_element);

                    // type of word (ichidan verb, etc)
                    if (sense.pos != null) {
                        poses = Array.isArray(sense.pos) ? sense.pos : [sense.pos];
                        for(pos of poses) { sense_extras += pos + ", "; }
                    }
                    // antonym
                    if (sense.ant != null) {
                        ants = Array.isArray(sense.ant) ? sense.ant : [sense.ant];
                        for(ant of ants) { sense_extras += "antonym: " + ant + ", "; }
                    }
                    // "this sense is restricted to only [keb]"
                    if(sense.stagk != null) {
                        stagks = Array.isArray(sense.stagk) ? sense.stagk : [sense.stagk];
                        for(stagk of stagks) { sense_extras += "only " + stagk + ", "; }
                    }
                    // "this sense is restricted to only [reb]"
                    if(sense.stagr != null) {
                        stagrs = Array.isArray(sense.stagr) ? sense.stagr : [sense.stagr];
                        for(stagr of stagrs) { sense_extras += "only " + stagk + ", "; }
                    }
                    // "see also [keb/reb]"
                    if(sense.xref != null) {
                        xrefs = Array.isArray(sense.xref) ? sense.xref : [sense.xref];
                        for(xref of xrefs) { sense_extras += "see also: " + xref + ", "; }
                    }
                    // field (eg physics)
                    if(sense.field != null) {
                        fields = Array.isArray(sense.field) ? sense.field : [sense.field];
                        for(field of fields) { sense_extras += field + ", "; }
                    }
                    // misc info
                    if(sense.misc != null) {
                        miscs = Array.isArray(sense.misc) ? sense.misc : [sense.misc];
                        for(misc of miscs) { sense_extras += misc + ", "; }
                    }
                    // dialect
                    if(sense.dial != null) {
                        dials = Array.isArray(sense.dial) ? sense.dial : [sense.dial];
                        for(dial of dials) { sense_extras += dial + ", "; }
                    }
                    // loanword
                    if(sense.lsource != null) {
                        lsources = Array.isArray(sense.lsource) ? sense.lsource : [sense.lsource];
                        for(lsource of lsources) {
                            sense_extras += "from \"" + lsource['#text'] + "\" (" + lsource['@attributes']['xml:lang'] + ")" + ", ";
                        }
                    }
                    // "sense-information"
                    if(sense.s_inf != null) {
                        s_infs = Array.isArray(sense.s_inf) ? sense.s_inf : [sense.s_inf];
                        for(s_inf of s_infs) { sense_extras += s_inf + ", "; }
                    }

                    if (sense_extras.length != "") {
                        sense_extras_element = results_container_column.createElement("div");
                        sense_extras_element.setAttribute("class", "senses_extras");
                        sense_extras_element.textContent = sense_extras.slice(0,-2);
                        sense_block_container.appendChild(sense_extras_element);
                    }
                    senses_container.appendChild(sense_block_container);
                } else if (xml_lang == "ger") {
                    // just focus on glosses for now but do a loop run searching
                    // for objects whose key name isn't "gloss"
                    bit = "";
                    for (gloss of glosses) {
                        bit += gloss['#text'] + ", ";
                    }
                    senses_german.push(bit.slice(0,-2));
                    console.log("senses_german.length = " + senses_german.length);
                } else { console.log("xml:lang = \"" + xml_lang + "\", skipping"); }
            }

            if (senses_german.length > 0) {
                sense_block_container_de = results_container_column.createElement("div");
                sense_block_container_de.setAttribute("class", "senses_block_container_de");
                de_lead_in = results_container_column.createElement("div");
                de_lead_in.setAttribute("class", "senses_german_lead");
                de_lead_in.textContent = "DE";
                sense_block_container_de.appendChild(de_lead_in);

                for (let i=0;i<senses_german.length;i++) {
                    new_html_element = results_container_column.createElement("div");
                    new_html_element.setAttribute("class", "senses_german");
                    new_html_element.textContent = senses_german[i];
                    sense_block_container_de.appendChild(new_html_element);
                    add_clipboard_event(sense_block_container_de);

                    if (i < senses_german.length - 1) {
                        separator = results_container_column.createElement("div");
                        separator.setAttribute("class","senses_german_lead");
                        separator.textContent = "・";
                        sense_block_container_de.appendChild(separator);
                    }
                }
                senses_container.appendChild(sense_block_container_de);
            }

            if(has_freq_tag) {
                if(hiraganaless_match) { priority += 2; }
                else { priority++; }
            } else {
                if(hiraganaless_match) { priority++; }
            }

            row_container.setAttribute("priority", priority);

            results_tally++;
            // DISCARD LOW PRIO IF TOO MANY RESULTS, DISCARD ALL IF WAY TOO MANY
            if (results_tally >= 1500) {
                i=entries.length; // quits the for loop
            } else {
                // ordering
                if (priority == 0 && results_tally <= 1000) { results_container_column.body.appendChild(row_container); results_counter++; }
                else if (priority == 1) { row_prio_container.after(row_container); results_counter++; }
                else if (priority == 2) { row_prio_container.appendChild(row_container); results_counter++; }
                else if (priority > 2) { row_prio_container.before(row_container); results_counter++; }
                else { discarded++; }
                if (search_only_string != "") {
                    row_container.setAttribute("search-only", search_only_string.slice(0,-1)); // slice trailing " " (if it even matters lol)
                }
            }

        } // end of if (found)

    }// end of jmdict main for-loop
    if (display_counter) { await results_counter_update(results_counter); }
    new_iframe.style.setProperty("display", "block");

    // inform user that search was cut off due to too many results
    if (results_tally >= 1001) {
        toomanyresults = results_container_column.createElement("div");
        toomanyresults.setAttribute("class", "no_results"); // reuse
        if (results_tally >= 1500) {
            toomanyresults.textContent = "Aborted search at 1500 matches, discarded low priority results after the 1000th match (discarded: " + discarded + ")";
        } else {
            toomanyresults.textContent = "Discarded low priority results after the 1000th match (matches: " + results_tally + ", discarded: " + discarded + ")";
        }
        results_container_column.body.children[0].before(toomanyresults);
    }

    console.log("searchXML(): results_container_column.body.childElementCount: " + results_container_column.body.childElementCount);
    if(results_container_column.body.childElementCount < 2 && row_prio_container.childElementCount == 0) {
        no_results = results_container_column.createElement("div");
        no_results.textContent = "No results for \"" + search_word + "\"";
        no_results.setAttribute("class", "no_results");
        results_container_column.body.appendChild(no_results);
        tracker_no_results = true;
    } else { tracker_no_results = false; }

    // if there are multiple searches, display search term
    // at the top
    if(display_search_term_header) {
        header = results_container_column.createElement("div");
        header.setAttribute("class", "search_term_header");
        header.textContent = search_word;
        results_container_column.body.children[0].before(header);
    }

    return new Promise(resolve => setTimeout(resolve, 10));
}

// SEARCH COMMANDER
search_ongoing=false;
async function searchexec(optional_string, pushstate) {
    if(search_ongoing) {
        console.log("searchexec(): a search is already ongoing, quitting");
        return;
    } else { search_ongoing=true; }
    if (pushstate == null) { pushstate=true; }
    console.log("searchexec(" + optional_string + ", " + pushstate + ")");

    search_field_contents = document.getElementById("search_field").value;
    document.getElementById("search_field").value = "";
    if (search_field_contents != null && search_field_contents.match(/^\s*$/) == null) {
        console.log("searchexec(): search field was not empty, adding keywordbox for \"" + search_field_contents + "\"");
        await keywordbox_add(search_field_contents);
    }
    // for safety, if we were passed a string, prioritize it over search field
    // worried about race conditions, I dunno
    is_direct_search = false;
    if (optional_string != null) {
        is_direct_search = true;
        console.log("searchexec(): is direct search");
    } else { console.log("searchexec(): is not direct search"); }

    if (document.getElementsByClassName("keywordbox").length == 0 && optional_string == null) {
        console.log("searchexec(): no search terms, quitting");
        document.getElementById("results_count").textContent = "";
        document.getElementById("greeting_container").style.setProperty("display", "block");
        document.getElementById("results_container").style.setProperty("display", "none");
        // remove search word from url if there was any
        url = window.location;
        snip = url.href.match(/.*\?/);
        if (snip != null) {
            if (pushstate); {
                window.history.pushState({},'',snip[0].slice(0,-1)); }
        }
        await status_update("");
        document.getElementsByTagName("title")[0].textContent = "JMdict Searcher";
        update_search_label();
        search_ongoing=false;
        return;
    }

    // build search string (containing all key word strings, separated by spaces)
    full_search_string="";
    if (is_direct_search) { full_search_string = optional_string; }
    else  {
        keywordbox_array = document.getElementsByClassName("keywordbox");
        console.log("searchexec(): keywordbox_array.length = " + keywordbox_array.length);
        for (v=0;v<keywordbox_array.length;v++) {
            console.log("searchexec(): adding \"" + keywordbox_array[v].textContent + "\" to full_search_string");
            full_search_string += keywordbox_array[v].textContent + " ";
            console.log("searchexec(): full_search_string = " + full_search_string);
        }
        full_search_string = full_search_string.slice(0,-1);
    }


    search_array = full_search_string.split(/\s+/);
    console.log("searchexec(): full_search_string = \"" + full_search_string + "\"");
    console.log("searchexec(): search_array.length = \"" + search_array.length + "\"");

    results_counter=0;
    await disable_input(true);
    await unfocus();
    document.getElementById("greeting_container").style.setProperty("display", "none");
    // add search word to url
    url = new URL(window.location);
    url.searchParams.set('q', full_search_string);
    if (pushstate) { window.history.pushState({}, '', url); }

    if (display_counter) {await results_counter_update(results_counter);}

    document.getElementById("results_container").innerHTML = "";
    await status_update("Searching");
    document.getElementsByTagName("title")[0].textContent = "";
    if(search_array.length > 1) { multisearch=true; } else { multisearch=false; }
        for (let x=0;x<search_array.length;x++) {
            console.log("searchexec(): Calling searchXML(\"" + search_array[x] + "\")");
            if (search_array[x] !== null) {
                if (x == 0) {
                    document.getElementsByTagName("title")[0].textContent += search_array[x];
                } else {
                    document.getElementsByTagName("title")[0].textContent = document.getElementsByTagName("title")[0].textContent + "・" + search_array[x];
                }
                await searchXML(search_array[x], multisearch);

                if (display_counter) {await results_counter_update(results_counter);}
            }
        }
        await disable_input(false);
    if (tracker_no_results) { await disable_input(false); focus(); }
    else { document.getElementsByClassName("results_container_column")[0].focus(); }
    await status_update("");
    search_ongoing=false;
    console.log("searchexec(): end");
}

// PASTE LOGIC
async function paste(replace) {
    navigator.clipboard
    .readText()
        .then((cliptext) => {
        if (replace) {
            clear_input();
        }
        new_search_array=cliptext.split(/\s+/);
        for (u=0;u<new_search_array.length;u++) { keywordbox_add(new_search_array[u]); }
        searchexec();
    });
    update_search_label();
}

// CLEAR, PASTE & GO
async function clear_paste() {
    paste(true);
    update_search_label();
}

// FORWARD / BACK BUTTON HANDLER
window.addEventListener('popstate', async function(event) {
    console.log("popstate event");
    url_query_params = new URLSearchParams(window.location.search);
    url_query_search_word = url_query_params.get('q');
    clear_input();
    search_words_array = url_query_search_word.split(/\s+/);
    for (u=0;u<search_words_array.length;u++) {
        keywordbox_add(search_words_array[u]);
    }
    searchexec(url_query_search_word, false); // do not push state
});



// SITE-WIDE KEY INPUT HANDLER
// originally just for focusing search bar, now additionally
// having to emulate CTRL+A textbox behavior after adding keywordboxes
// (great idea)
ctrl_a = 0; // 0 - nothing pressed, 1 - pressed control, 2 - pressed "a" after pressing control
function add_keydown_event(element) {
    element.addEventListener("keydown", (e) => {

        console.log("keydown event: " + e.key);
        update_search_label();
        let x = e.key;
        // whitelist, to prevent focus() from fucking with browser functions like F3 or CTRL+F5
        if (x.match(/^[a-z]$/) != null || x == " " || x == "Control") {
            console.log("keydown event: calling focus() (focus search bar)");
            focus();
        }
        else {
            if(x == "ArrowUp"
            || x == "ArrowDown"
            || x == "Home"
            || x == "End"
            || x == "PageDown"
            || x == "PageUp") {
                //console.log("keydown event: focusing first results_container_column if there is one");
                // text box needs immediate focus() for IME (CTRl+Space) to trigger but
                // here we can add a safety delay
                // this doesn't seem to work properly lol
                col = document.getElementsByClassName("results_container_column")[0];
                if (col != null) {
                    setTimeout( () => {
                        // animation
                        //col.contentWindow.document.body.setAttribute("class","results_container_column_inside inset_shadow");
                        //setTimeout( () => { col.contentWindow.document.body.setAttribute("class","results_container_column_inside"); }, 500);

                        //console.log("keydown event: focusing results_container_column[0]");
                        col.focus();
                    }, 50);
                    // even without the timeout, pressing arrow up/down or pgup/dn once
                    // doesn't actually scroll the iframe yet, only after focus has been shifted
                } //else { console.log("keydown event: no results_container_columns"); }
            }
        }


        if (x == "Insert" || x == "ScrollLock" || x == "Pause") { light_mode(); }

        // to be safe, don't do ANY of this if input is currently disabled
        if (document.getElementById("search_field").disabled == false) {
            // track ctrl+alt+a (jank)
            console.log("keydown event: ctrl_a == " + ctrl_a);
            if (e.key == "Control") {
                if (ctrl_a == 0) { ctrl_a = 1; }
            }
            else if (e.key.toLowerCase() == "a") {
                if ( ctrl_a == 1 ) {
                    console.log("keydown event: pressed \"a\"");
                    console.log("keydown event: if next key is backspace, del or new input into search field, all previous keywordboxes will be deleted");
                    notification("Selected all search terms (CTRL+A event)");
                    ctrl_a = 2; // if next key is backspace, delete all keywordboxes
                } else if (ctrl_a == 2) {
                    // have to hard code for "a" because the "else" portion below isn't
                    // executed if user presses "a"
                    console.log("keydown event: pressed \"a\" after having pressed CTRL+A");
                    // refer to duplicate below in "else" section
                    setTimeout( () => {
                    if (document.getElementById("search_field").value.length > 0) {
                        console.log("keydown event: new input in search_field, deleting all previous keywordboxes");
                        notification("Replacing all search terms (CTRL+A event)")
                        while(boxes[0]) {boxes[0].remove();}
                        console.log("keydown event: trying to do some selection fuckery");
                        frames = document.getElementsByTagName("iframe");
                        for (b=0;b<frames.length;b++) { frames[b].contentWindow.getSelection().removeAllRanges(); }
                        ctrl_a = 0;
                    }},100);
                }
            }
            else if (e.key == "Backspace" || e.key == "Delete") {
                if (ctrl_a == 2 || ctrl_a == 3) {
                    console.log("keydown event: detected CTRL+A -> DEL or BACKSPACE, deleting all search terms");
                    notification("Deleted all search terms (CTRL+A event)");
                    boxes = document.getElementsByClassName("keywordbox");
                    while(boxes[0]) { boxes[0].remove(); }
                    console.log("keydown event: trying to do some selection fuckery");
                    frames = document.getElementsByTagName("iframe");
                    for (b=0;b<frames.length;b++) { frames[b].contentWindow.getSelection().removeAllRanges(); }
                    document.getElementById("search_field").value = "";
                    ctrl_a = 0;
                }
            }
            else {
                // duplicate of above (a) (except for ctrl_a == 2 check)
                setTimeout( () => {
                if (document.getElementById("search_field").value.length > 0 && ctrl_a == 2) {
                    console.log("keydown event: new input in search_field, deleting all previous keywordboxes");
                    notification("Replaced search terms (CTRL+A event)");
                    while(boxes[0]) {boxes[0].remove();}
                    console.log("keydown event: trying to do some selection fuckery");
                    frames = document.getElementsByTagName("iframe");
                    for (b=0;b<frames.length;b++) { frames[b].contentWindow.getSelection().removeAllRanges(); }
                }

                // detect CTRL+V, start search if detected
                if (e.key.toLowerCase() == "v" && ctrl_a == 1 && document.getElementById("search_field").value.length > 0) {
                        console.log("keydown event: pressed CTRL+V, starting search");
                        notification("Starting search (CTRL+V event)");
                        setTimeout( () => { searchexec(); }, 100);
                    }
                    else if (e.key.toLowerCase() == "v" && ctrl_a == 2 && document.getElementById("search_field").value.length > 0) {
                        console.log("keydown event: pressed CTRL+V after CTRL+A, replacing search terms and starting search");
                        notification("Replaced search terms and starting search (CTRL+A -> CTRL+V event)");
                        while(boxes[0]) { boxes[0].remove(); }
                        setTimeout( () => { searchexec(); }, 100);
                }
                ctrl_a = 0;
                }, 100);
            }
        }
    });
}

// copy to clipboard from eventhandler
function clipboard(text) {
    navigator.clipboard.writeText(text);
    console.log("clipboard(): copy to clipboard: " + text);
    notification("Copied: " + text);
}

// ADD CLIPBOARD FUNCTIONALITY
last_clicked_element = null;
function add_clipboard_event(element) {
    element.addEventListener("click", (event) => {
        let new_clipboard_text = "";
        console.log("click event: element.tagName: " + element.tagName);
        if (last_clicked_element == element) {
            if (element.getAttribute("class") == "kanjidic2_mr_container") {
                console.log("click event: is kanjidic2_mr_container");
                new_clipboard_text = element.children[0].textContent;
            } else {
                console.log("click event: is NOT kanjidic2_mr_container");
                new_clipboard_text = element.textContent;
                console.log("click event: trying to do some selection fuckery");
                frames = document.getElementsByTagName("iframe");
                for (b=0;b<frames.length;b++) { frames[b].contentWindow.getSelection().removeAllRanges(); }
            }

            clipboard(new_clipboard_text);
        } else { notification("Click again to copy to clipboard"); last_clicked_element = element; }
    });
}

            timeout_queue=-1;

            }, 300);
            timeout_queue = 0;
        } else { if(timeout_queue > 0) { timeout_queue--; } }
    }, 500);
}

// LIGHT MODE TOGGLE
light_mode_enabled=false;
function light_mode(add_to) {
    // if argument (iframe) provided, just add light css to that element
    if (add_to != null) {
        e = add_to.createElement("link");
        e.setAttribute("href", "light.css");
        e.setAttribute("rel", "stylesheet");
        e.setAttribute("id", "light_css");
        add_to.head.appendChild(e);
        return;
    }

    // toggle / modify globally
    if (light_mode_enabled) {
        // disable it
        notification("Disabling Light Mode");
        document.getElementById("light_css").remove();

        // iframes
        iframes = document.getElementsByTagName("iframe");
        if (iframes != null) {
            for (let i=0;i<iframes.length;i++) {
                iframes[i].contentWindow.document.getElementById("light_css").remove();
            }
        }

        light_mode_enabled=false;
    } else {
        // enable it
        notification("Enabling Light Mode");
        e = document.createElement("link");
        e.setAttribute("href", "light.css");
        e.setAttribute("rel", "stylesheet");
        e.setAttribute("id", "light_css");
        document.head.appendChild(e);

        // iframes
        iframes = document.getElementsByTagName("iframe");
        if (iframes != null) {
            for (let i=0;i<iframes.length;i++) {
                doc = iframes[i].contentWindow.document;
                e = doc.createElement("link");
                e.setAttribute("href", "light.css");
                e.setAttribute("rel", "stylesheet");
                e.setAttribute("id", "light_css");
                doc.head.appendChild(e);
            }
        }

        light_mode_enabled=true;
    }
}
function global_css_var(name, value, target_iframe) {
    // main/global document
    document.documentElement.style.setProperty("--" + name, value);

    // iframes
    iframes = document.getElementsByTagName("iframe");
    if (iframes != null) {
        for (let i=0;i<iframes.length;i++) {
            iframes[i].contentWindow.document.documentElement.style.setProperty("--" + name, value);
        }
    }
}
